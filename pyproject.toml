[project]
name = "datadojo"
version = "0.3.3"
description = "Local Data & AI interview practice (SQL, Python, PySpark, AI, ML) with friendly AI coaches."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "duckdb>=1.1",
    "pyspark>=3.5,<3.6",
    "sqlglot>=25",
    "psycopg[binary]>=3.2",
    "anthropic>=0.70",
    "black>=24",
]

[project.optional-dependencies]
desktop = ["pywebview>=5"]  # native window for the packaged app; `datadojo` itself uses the browser

[project.scripts]
datadojo = "datadojo.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datadojo"]

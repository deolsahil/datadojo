<!-- launch intro: drawn before anything else, always dark. A gate script below removes it unless this is a fresh open of
     the home page and motion is welcome. app.js starts it (class "play") once the logo font is ready. -->
<div id="intro" class="intro" aria-hidden="true">
  <style>
    html.intro-on { overflow: hidden }
    /* the app waits, faded and a hair smaller, behind the intro, then eases in as one piece when the intro lifts */
    html.intro-on #app, html.intro-on .nav { opacity: 0; transform: scale(.985) }
    html.intro-reveal #app, html.intro-reveal .nav { transition: opacity .8s cubic-bezier(.4,0,.2,1) .2s, transform 1s cubic-bezier(.2,.8,.2,1) .2s }
    /* the app's own dark background (--bg + --art of the midnight theme), so the intro flows straight into the app */
    .intro { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; cursor: pointer; background:
      radial-gradient(1200px 500px at 85% -10%, rgba(125,211,252,.07), transparent 60%),
      radial-gradient(900px 400px at 0% 0%, rgba(251,191,36,.05), transparent 60%), #0b0d11;
      transition: opacity .75s cubic-bezier(.4,0,.2,1) .15s }
    .intro.out { opacity: 0; pointer-events: none }
    .intro-scene { position: relative; display: flex; flex-direction: column; align-items: center;
      transition: transform .6s cubic-bezier(.4,0,.2,1), opacity .45s ease }
    .intro.out .intro-scene { transform: translateY(-14px) scale(.97); opacity: 0 }
    .intro.out .intro-skip { opacity: 0; transition: opacity .2s }
    .intro-row { position: relative; display: flex; gap: .02em; font: 800 clamp(56px, 9vw, 120px)/1 "JetBrains Mono", ui-monospace, Menlo, monospace }
    .intro .ch { display: inline-block; width: .6em; text-align: center; transform-origin: 50% 100%; color: var(--c); opacity: 0; text-shadow: 0 6px 0 rgba(0,0,0,.35) }
    .intro .pellet { position: absolute; bottom: 30%; left: calc(var(--i) * 12.5% + 6%); width: 16px; height: 34px; border-radius: 10px; background: var(--c); opacity: 0 }
    .intro .coach { position: absolute; top: -78px; left: calc(var(--slot) * 12.5% + 6.25% - 36px); transform: translateY(-120vh); transform-origin: 50% 100% }
    .intro .coach .love { position: absolute; inset: 0; opacity: 0 }
    .intro .coach svg { display: block }  /* inline, it would sit on the 120px wordmark's baseline and drop onto the letters */
    .intro-tag { margin-top: 40px; font: 500 14px "JetBrains Mono", ui-monospace, monospace; letter-spacing: .3em; color: #8a92a0; opacity: 0 }
    .intro-skip { position: absolute; bottom: 28px; left: 0; right: 0; text-align: center; font: 11px "JetBrains Mono", monospace; letter-spacing: .14em; color: #5a6270; opacity: 0 }
    .intro.play .coach { animation: in-drop .9s cubic-bezier(.3,0,.4,1) both, in-squash .5s ease both; animation-delay: calc(var(--i) * 120ms), calc(var(--i) * 120ms + .62s) }
    .intro.play .pellet { animation: in-pellet .5s cubic-bezier(.5,0,.5,1) both; animation-delay: calc(.45s + var(--i) * 85ms) }
    .intro.play .ch { animation: in-pop .7s cubic-bezier(.3,1.6,.5,1) both; animation-delay: calc(.85s + var(--i) * 85ms) }
    .intro.play .coach .happy { animation: in-out .25s ease 2.2s both } .intro.play .coach .love { animation: in-in .25s ease 2.2s both }
    .intro.play .intro-tag { animation: in-up .7s ease 1.9s both }
    .intro.play .intro-skip { animation: in-in .5s ease 1s both }
    @keyframes in-drop { 0% { transform: translateY(-120vh) } 70% { transform: translateY(0) } 85% { transform: translateY(-26px) } 100% { transform: translateY(0) } }
    @keyframes in-squash { 0% { scale: 1 } 30% { scale: 1.25 .72 } 60% { scale: .92 1.08 } 100% { scale: 1 } }
    @keyframes in-pellet { 0% { opacity: 0; transform: translateY(-140px) scaleY(.4) } 30% { opacity: 1 } 80% { opacity: 1; transform: translateY(0) scaleY(1.2) } 100% { opacity: 0; transform: translateY(10px) scale(1.6, .3) } }
    @keyframes in-pop { 0% { opacity: 0; transform: scale(.2, .1) } 40% { opacity: 1; transform: scale(1.25, .75) } 70% { transform: scale(.92, 1.12) } 100% { opacity: 1; transform: none } }
    @keyframes in-up { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
    @keyframes in-in { to { opacity: 1 } } @keyframes in-out { to { opacity: 0 } }

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DataDojo</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script>document.documentElement.dataset.theme = localStorage.getItem('theme') || 'midnight'  /* dark until the learner picks light */</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- fonts load without blocking the first paint (a slow network used to leave the window blank) -->
<link rel="stylesheet" id="font-css" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700;800&display=swap" media="print" onload="this.media='all'; this.dataset.ready=1">
<link rel="stylesheet" href="vendor/blobatar/motion.css">
<link rel="stylesheet" href="vendor/blobatar/gaze.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="nav">
  <a class="logo" href="#/" title="Home" aria-label="DataDojo home"><svg class="logo-mark" viewBox="0 0 64 64" aria-hidden="true"><path d="M47.5 12.5A24 24 0 1 0 55.5 26" fill="none" stroke-width="7.5" stroke-linecap="round"/><circle cx="44" cy="31" r="6"/></svg><span class="logo-word"><b>data</b><span>dojo</span><i>.</i></span></a>
  <nav>
    <div class="dd"><button class="dd-btn" aria-haspopup="true">Practice <span class="caret-dd">▾</span></button>
      <div class="dd-menu">
        <a href="#/lang/sql" data-nav="sql">SQL</a>
        <a href="#/lang/python" data-nav="python">Python</a>
        <a href="#/lang/pyspark" data-nav="pyspark">PySpark</a>
        <a href="#/list/ml-ai" data-nav="ml-ai">ML &amp; AI</a>
      </div></div>
    <a href="#/interview" data-nav="interview">Interview</a>
    <a href="#/design" data-nav="design">System Design</a>
    <a href="#/games" data-nav="games">Games</a>
  </nav>
  <span class="sp"></span>
  <div class="by" id="by" hidden></div>
  <button class="theme-btn" id="theme-btn"></button>
  <button class="me" id="me" title="Change your name"></button>
</header>
<main id="app"><div class="boot" role="status" aria-label="Opening DataDojo"><svg class="boot-mark" viewBox="0 0 64 64" aria-hidden="true"><path class="boot-ring" pathLength="100" d="M47.5 12.5A24 24 0 1 0 55.5 26"/><circle class="boot-dot" cx="44" cy="31" r="6"/></svg><span>Opening datadojo</span></div></main><!-- replaced by the first page -->
<div id="modal" class="modal" hidden><div class="modal-box"><button class="x" id="modal-x">✕</button><div id="modal-body"></div></div></div>
<script src="app.js"></script>
</body>
</html>

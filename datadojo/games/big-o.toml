lang = "python"
code = '''
# n = len(users), a dict of user_id -> profile
def is_user(users, uid):
    return uid in users.keys()
'''
answer = "O(1)"
why = "dict.keys() is a view backed by the hash table, not a list copy, so `in` on it is an O(1) average lookup."


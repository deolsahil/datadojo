# Big-O Sprint: time complexity of each snippet. Strings and records are short (constant size) unless noted.

[[items]]
lang = "python"
code = '''
# n = len(ids) = len(blocked); blocked is a list
def allowed(ids, blocked):
    return [i for i in ids if i not in blocked]
'''
answer = "O(n²)"
why = "`not in` on a list is a linear scan, and it runs once per id, so the total is n × n."

[[items]]
lang = "python"
code = '''
# n = len(ids) = len(blocked)
def allowed(ids, blocked):
    blocked = set(blocked)
    return [i for i in ids if i not in blocked]
'''
answer = "O(n)"
why = "Building the set takes O(n), and after that each membership check is an O(1) average hash lookup."

[[items]]
lang = "python"
code = '''
# n = len(scores)
top3 = []
for s in scores:
    top3 = sorted(top3 + [s])[-3:]
'''
answer = "O(n)"
why = "sorted() runs inside the loop, but it never sorts more than 4 items, which is constant work. One pass over n scores gives O(n)."

[[items]]
lang = "python"
code = '''
# n = len(words)
out = ""
for w in words:
    out = w + " " + out   # prepend
'''
answer = "O(n²)"
why = "Strings are immutable, so each prepend copies the whole string built so far. Copies of length 1, 2, ..., n add up to O(n²). Use ' '.join(reversed(words))."

[[items]]
lang = "python"
code = '''
# n = len(words)
parts = reversed(words)
out = " ".join(parts)
'''
answer = "O(n)"
why = "join measures the total length once and copies each piece one time."


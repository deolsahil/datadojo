[[items]]
lang = "python"
code = '''
# n = len(ids)
unique = set(ids)
unique_sorted = sorted(unique)
'''
answer = "O(n log n)"
why = "Deduplicating is O(n), and comparison-sorting up to n distinct values is O(n log n), which dominates."

[[items]]
lang = "python"
code = '''
# n is the argument
grid = [[0] * n for _ in range(n)]
grid[0][0] = 1
'''
answer = "O(n²)"
why = "It creates n rows of n cells each, n² cells in total."

[[items]]
lang = "python"
code = '''
# n = exponent e; b is a float, count multiplications
def power(b, e):
    if e == 0:
        return 1.0
    half = power(b, e // 2)
    return half * half * (b if e % 2 else 1.0)
'''
answer = "O(log n)"
why = "Exponentiation by squaring halves the exponent on each call, so it takes about log2(n) calls with a constant number of multiplications each."

[[items]]
lang = "sql"
code = '''
-- n = rows in orders; PostgreSQL, B-tree primary key on id
SELECT *
FROM orders
WHERE id = 42;
'''
answer = "O(log n)"
why = "A B-tree index lookup walks from root to leaf, and the tree is O(log n) levels deep."

[[items]]
lang = "sql"
code = '''
-- n = rows in orders; no index on status
SELECT COUNT(*)
FROM orders
WHERE status = 'paid';
'''
answer = "O(n)"
why = "With no index the engine must scan every row and test the predicate on each one."

[[items]]
lang = "sql"
code = '''
-- n = rows in events
SELECT a.id, b.id
FROM events a
JOIN events b ON a.ts < b.ts;
'''
answer = "O(n²)"
why = "An inequality self-join can produce about n²/2 rows, and the work is at least the size of the output."

[[items]]
lang = "sql"
code = '''
-- n = rows in orders; no index on amount
SELECT id, amount
FROM orders
ORDER BY amount;
'''
answer = "O(n log n)"
why = "Returning all n rows in order needs a full comparison sort."

[[items]]
lang = "sql"
code = '''
-- n = rows in orders = rows in customers; each order matches one customer (hash join)
SELECT o.id, c.name
FROM orders o
JOIN customers c ON c.id = o.customer_id;
'''
answer = "O(n)"
why = "A hash join builds a hash table on one side in O(n), then probes it once per row of the other side in O(1) average."


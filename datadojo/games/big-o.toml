lang = "python"
code = '''
# n = len(rows); COLS is a fixed list of 5 column names
for row in rows:
    for c in COLS:
        row[c] = row[c].strip()
'''
answer = "O(n)"
why = "The inner loop always runs 5 times, a constant, so the nested loops do 5n steps."


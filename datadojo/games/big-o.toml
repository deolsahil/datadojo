lang = "python"
code = '''
import heapq
# n = len(nums)
heap = []
for x in nums:
    heapq.heappush(heap, x)
ordered = [heapq.heappop(heap) for _ in range(len(heap))]
'''
answer = "O(n log n)"
why = "Each push and each pop costs O(log n) on a heap of up to n items, and there are n of each."

[[items]]
lang = "python"
code = '''
import heapq
# n = len(nums)
heapq.heapify(nums)
smallest = nums[0]
'''
answer = "O(n)"
why = "heapify builds the heap bottom-up in linear time, which is cheaper than n pushes, and reading nums[0] is O(1)."

[[items]]
lang = "python"
code = '''
# n is the argument
def fib(n):
    if n < 2:
        return n
    return fib(n - 1) + fib(n - 2)
'''
answer = "O(2ⁿ)"
why = "Every call branches into two more and the same subproblems are recomputed again and again, so the call tree grows exponentially. The tight bound is about 1.6ⁿ, which is still in the exponential class."

[[items]]
lang = "python"
code = '''
from functools import lru_cache
# n is the argument
@lru_cache(maxsize=None)
def fib(n):
    if n < 2:
        return n
    return fib(n - 1) + fib(n - 2)
'''
answer = "O(n)"
why = "With memoization each value from 0 to n is computed once, and repeat calls are cache hits."

[[items]]
lang = "python"
code = '''
# n = len(prices), a dict of sku -> price
def price_of(prices, sku):
    return prices.get(sku, 0.0)
'''
answer = "O(1)"
why = "A dict lookup hashes the key and goes straight to its slot, taking O(1) on average however big the dict is."

[[items]]
lang = "python"
code = '''
# n = len(xs)
def total(xs):
    if not xs:
        return 0
    return xs[0] + total(xs[1:])
'''
answer = "O(n²)"
why = "xs[1:] copies the rest of the list on every call, so the copies have length n-1, n-2, ..., 1, which adds up to quadratic."

[[items]]
lang = "python"
code = '''
# n = len(xs)
def total(xs, i=0):
    if i == len(xs):
        return 0
    return xs[i] + total(xs, i + 1)
'''
answer = "O(n)"
why = "Passing an index instead of a slice avoids copying, so each of the n calls does O(1) work."

[[items]]
lang = "python"
code = '''
# n = len(xs), xs sorted ascending
def has_pair_sum(xs, target):
    i, j = 0, len(xs) - 1
    while i < j:
        s = xs[i] + xs[j]
        if s == target: return True
        if s < target: i += 1
        else: j -= 1
    return False
'''
answer = "O(n)"
why = "Every step moves one of the two pointers inward, and they meet after at most n steps."

[[items]]
lang = "python"
code = '''
# n = len(xs), xs unsorted
def has_pair_sum(xs, target):
    xs = sorted(xs)
    i, j = 0, len(xs) - 1
    while i < j:
        s = xs[i] + xs[j]
        if s == target: return True
        i, j = (i + 1, j) if s < target else (i, j - 1)
    return False
'''
answer = "O(n log n)"
why = "The two-pointer scan is O(n), but sorting first costs O(n log n), and the sort is the larger term."

[[items]]
lang = "python"
code = '''
# n = len(queue), a list
while queue:
    job = queue.pop(0)
    run(job)  # O(1)
'''
answer = "O(n²)"
why = "list.pop(0) shifts every remaining element left, which is O(n) per pop. Use collections.deque."

[[items]]
lang = "python"
code = '''
from collections import deque
# n = len(jobs)
queue = deque(jobs)
while queue:
    run(queue.popleft())  # run is O(1)
'''
answer = "O(n)"
why = "deque.popleft() is O(1), so draining n jobs is linear."

[[items]]
lang = "python"
code = '''
# n is the starting value
steps = 0
while n > 1:
    n //= 2
    steps += 1
'''
answer = "O(log n)"
why = "Halving n on each iteration reaches 1 after about log2(n) iterations."

[[items]]
lang = "python"
code = '''
# n = len(xs)
def count_subsets(xs, target, i=0):
    if i == len(xs):
        return int(target == 0)
    return (count_subsets(xs, target - xs[i], i + 1)
            + count_subsets(xs, target, i + 1))
'''
answer = "O(2ⁿ)"
why = "Each element is either taken or skipped, so the recursion visits all 2ⁿ subsets."

[[items]]
lang = "python"
code = '''
# n = len(a) = len(b)
def common(a, b):
    return set(a) & set(b)
'''
answer = "O(n)"
why = "Building both sets is linear, and the intersection does one O(1) average lookup per element of the smaller set."


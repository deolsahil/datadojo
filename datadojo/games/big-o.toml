lang = "python"
code = '''
# n = len(xs)
pairs = 0
for i in range(len(xs)):
    for j in range(i + 1, len(xs)):
        pairs += xs[i] + xs[j] == 0
'''
answer = "O(n²)"
why = "Starting j at i + 1 halves the work, but n(n-1)/2 comparisons is still quadratic."

[[items]]
lang = "python"
code = '''
# n = len(xs), xs sorted
def find(xs, target):
    lo, hi = 0, len(xs) - 1
    while lo <= hi:
        mid = (lo + hi) // 2
        if xs[mid] == target: return mid
        if xs[mid] < target: lo = mid + 1
        else: hi = mid - 1
    return -1
'''
answer = "O(log n)"
why = "Binary search halves the remaining range on every step, so it takes about log2(n) steps."

[[items]]
lang = "python"
code = '''
import bisect
# n = len(stream)
seen = []
for x in stream:
    bisect.insort(seen, x)
'''
answer = "O(n²)"
why = "insort finds the position in O(log n), but inserting into a list shifts everything after it, which is O(n) per insert. Over n inserts that is O(n²)."


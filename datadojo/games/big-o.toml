lang = "pyspark"
code = '''
# n = rows in df (total work, ignoring parallelism)
rows = df.collect()
ids = [r["id"] for r in rows]
dupes = [i for i in ids if ids.count(i) > 1]
'''
answer = "O(n²)"
why = "list.count scans all n ids and runs once per id. A Counter, or df.groupBy('id').count(), would be linear."

[[items]]
lang = "pyspark"
code = '''
# n = rows in df (total work, ignoring parallelism)
counts = df.groupBy("country").count()
counts.write.parquet("s3://lake/country_counts/")
'''
answer = "O(n)"
why = "A hash aggregate touches each row once with O(1) average work per update, the shuffle is linear in n, and the output is at most n rows."

[[items]]
lang = "pyspark"
code = '''
from pyspark.sql import Window, functions as F
# n = rows in df, all in one partition (total work)
w = Window.orderBy("ts")
df = df.withColumn("rn", F.row_number().over(w))
'''
answer = "O(n log n)"
why = "To number rows by ts, Spark must first sort all n rows, and the sort dominates. The numbering pass after it is linear."

  "Downsample in event-time windows with allowed lateness, storing sum/count/min/max so late data can update rollups.",
  "Tier storage: recent raw and rollups in a time-series DB, the full raw archive in Parquet/Iceberg on S3.",
  "Plan for reconnect storms with device backoff, broker rate limits and Kafka headroom.",
  "Use versioned, additive Protobuf schemas because many firmware versions coexist.",
]
common_mistakes = [
  "Storing a year of raw 10-second data in the hot time-series database.",
  "Storing only averages in rollups, which cannot be re-aggregated or corrected for late data.",
  "Using broker receive time as event time, so offline uploads distort charts.",
  "Ignoring reconnect storms; all devices retry at once and take down the edge.",
  "Treating missing messages as zero values instead of gaps.",
]

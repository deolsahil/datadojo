[[quiz]]
q = "5M devices each send a message every 10 seconds. What is the ingest rate?"
options = ["50K msg/s", "500K msg/s", "5M msg/s", "50M msg/s"]
answer = 1
why = "5M devices / 10 s = 500K messages per second."

[[quiz]]
q = "Why store sum and count in rollup tables rather than only the average?"
options = [
  "Averages use more storage",
  "Sums and counts can be combined into coarser buckets and updated when late data arrives; averages cannot",
  "Time-series databases cannot store averages",
  "It is required for compression",
]
answer = 1
why = "The average of averages is wrong when counts differ. Sum and count are additive, so hourly rollups can be built from minutes and corrected incrementally."

[[quiz]]
q = "At 500K messages/s and 200 B per message, roughly how much raw data per day?"
options = ["~864 GB", "~8.64 TB", "~86.4 TB", "~864 TB"]
answer = 1
why = "500K x 200 B = 100 MB/s; 100 MB/s x 86,400 s = 8.64 TB/day."

[[quiz]]
q = "Which is the best defense against a reconnect storm after a regional outage?"
options = [
  "Fixed 1-second retry intervals on devices",
  "Randomized exponential backoff on devices plus connection rate limits and Kafka headroom",
  "Dropping all buffered data on reconnect",
  "Using HTTP instead of MQTT",
]
answer = 1
why = "Jittered backoff spreads reconnects over time, broker rate limits protect the edge, and Kafka buffers the flush of offline data while processing catches up."

  "Bound state with watermarks and TTLs; prefer RocksDB and incremental checkpoints for large state.",
  "Flink favors low latency and complex state; Spark favors stack reuse; Kafka Streams suits Kafka-native apps.",
]
common_mistakes = [
  "Unbounded state from joins or dedup without TTL or watermarks.",
  "Using a 24-hour sliding window with a 1-second slide and multiplying state 86,400 times.",
  "Changing a Spark streaming query and reusing an incompatible checkpoint.",
  "Assuming exactly-once state means exactly-once external side effects.",
  "Ignoring backpressure until lag is hours.",
]

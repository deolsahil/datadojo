[[quiz]]
q = "What does a stream processing checkpoint contain to enable correct recovery?"
options = [
  "Only the output data",
  "Operator state and the source offsets at a consistent point",
  "Only the source offsets",
  "The job's code",
]
answer = 1
why = "Restoring state and offsets from the same logical point lets the job replay exactly the inputs not reflected in the state."

[[quiz]]
q = "Which window type fits 'group a user's clicks into visits that end after 30 minutes of inactivity'?"
options = ["Tumbling", "Sliding", "Session", "Global"]
answer = 2
why = "Session windows are per key and close after a gap of inactivity, so their length varies with user behavior."

[[quiz]]
q = "A 1-hour sliding window advancing every 5 minutes. How many windows does each event belong to?"
options = ["1", "5", "12", "60"]
answer = 2
why = "Window size divided by slide is 60 / 5 = 12 overlapping windows per event."

[[quiz]]
q = "A team already runs Spark batch jobs and needs a dashboard updated within a minute. What is the pragmatic choice?"
options = [
  "Rewrite everything in Flink",
  "Spark Structured Streaming micro-batches",
  "Kafka Streams in every microservice",
  "Hourly batch",
]
answer = 1
why = "Minute-level latency is well within micro-batch capabilities, and reusing the existing Spark stack lowers operational cost."

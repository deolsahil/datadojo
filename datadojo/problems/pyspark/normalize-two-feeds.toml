title = "Normalize two vendor feeds"
lang = "pyspark"
difficulty = "hard"
pattern = "spark-quality"
function = "solve"
statement = """
Two vendors send the same kind of payment record with different schemas:

- `feed_a(cust_id, amt, event_day)`: all strings. `cust_id` may have surrounding spaces, `amt` is
  dollars like `"12.50"`, and `event_day` is either `yyyy-MM-dd` or `MM/dd/yyyy`.
- `feed_b(customer, amount_cents, event_date)`: typed, with the amount in **cents**.

Write `solve(spark, feed_a, feed_b)` returning one unified table
`customer_id, amount, event_date, source`:

- `customer_id` INT, `amount` DOUBLE in dollars rounded to 2 decimals, `event_date` DATE,
  `source` is `"a"` or `"b"`.
- Drop any row where one of the three fields is NULL or cannot be parsed
  (e.g. a non-numeric id or amount, or an unrecognized date).
"""
hints = [
  "`.cast(\"int\")` / `.cast(\"double\")` return NULL for unparseable strings (ANSI mode is off by default).",
  "Pick the date format by shape, e.g. `F.when(col.contains(\"/\"), F.to_date(col, \"MM/dd/yyyy\")).otherwise(F.to_date(col, \"yyyy-MM-dd\"))`.",
  "Give both sides identical column names and types, `unionByName`, then drop rows with NULLs (`dropna`).",
]
starter = """
from pyspark.sql import functions as F

def solve(spark, feed_a, feed_b):
    return feed_b
"""
solution = '''
from pyspark.sql import functions as F

def solve(spark, feed_a, feed_b):
    d = F.trim("event_day")
    a = feed_a.select(
        F.trim("cust_id").cast("int").alias("customer_id"),
        F.round(F.trim("amt").cast("double"), 2).alias("amount"),
        F.when(d.rlike(r"^\d{2}/\d{2}/\d{4}$"), F.to_date(d, "MM/dd/yyyy"))
         .when(d.rlike(r"^\d{4}-\d{2}-\d{2}$"), F.to_date(d, "yyyy-MM-dd")).alias("event_date"),
        F.lit("a").alias("source"))
    b = feed_b.select(
        F.col("customer").alias("customer_id"),
        F.round(F.col("amount_cents") / 100, 2).alias("amount"),
        F.col("event_date"), F.lit("b").alias("source"))
    return a.unionByName(b).dropna()
'''

[[tests]]
tables.feed_a = { columns = "cust_id STRING, amt STRING, event_day STRING", rows = '''[
  [" 42 ", "12.50", "2024-01-05"], ["43", "7", "01/06/2024"], ["x1", "5.00", "2024-01-07"],
  ["44", "abc", "2024-01-07"], ["45", "3.10", "soon"], [null, "1.00", "2024-01-08"],
  ["46", "2.999", "2024-01-09"]]''' }
tables.feed_b = { columns = "customer INT, amount_cents INT, event_date DATE", rows = '''[
  [42, 1999, "2024-01-05"], [47, null, "2024-01-06"], [null, 500, "2024-01-06"],

title = "Latest profile with tie-breakers"
lang = "pyspark"
difficulty = "medium"
pattern = "spark-dedup-scd"
lists = ["pyspark-de"]
function = "solve"
statement = """
`profiles(user_id, email, updated_at, batch_seq)` merges profile updates from several batch loads.
Keep exactly **one** row per user, chosen deterministically:

1. The latest `updated_at` wins. A NULL `updated_at` is older than any real timestamp.
2. If tied, the higher `batch_seq` wins.
3. If still tied, the alphabetically smallest `email` wins.

Write `solve(spark, profiles)` returning `user_id, email, updated_at`.
"""
hints = [
  "`F.row_number()` over `Window.partitionBy(\"user_id\")`, keeping row 1.",
  "Put all three rules in one `orderBy`, and say where NULLs go explicitly: `F.col(\"updated_at\").desc_nulls_last()`.",
]
starter = """
from pyspark.sql import functions as F, Window

def solve(spark, profiles):
    return profiles.select("user_id", "email", "updated_at")
"""
solution = """
from pyspark.sql import functions as F, Window

def solve(spark, profiles):
    w = Window.partitionBy("user_id").orderBy(
        F.col("updated_at").desc_nulls_last(), F.col("batch_seq").desc(), F.col("email").asc())
    return (profiles.withColumn("rn", F.row_number().over(w)).filter("rn = 1")
            .select("user_id", "email", "updated_at"))
"""

[[tests]]
tables.profiles = { columns = "user_id INT, email STRING, updated_at TIMESTAMP, batch_seq INT", rows = '''[
  [1, "a@x.com", "2024-01-01 00:00:00", 1], [1, "c@x.com", "2024-01-02 00:00:00", 2],
  [1, "b@x.com", "2024-01-02 00:00:00", 1],
  [2, "d@x.com", null, 9], [2, "e@x.com", "2023-12-31 00:00:00", 1],
  [3, "f@x.com", null, 1], [3, "g@x.com", null, 2],
  [4, "i@x.com", "2024-01-05 00:00:00", 3], [4, "h@x.com", "2024-01-05 00:00:00", 3]]''' }

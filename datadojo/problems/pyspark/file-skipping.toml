title = "Data skipping with file statistics"
lang = "pyspark"
difficulty = "medium"
pattern = "spark-lakehouse"
lists = ["pyspark-de", "lakehouse"]
tags = ["databricks", "iceberg"]
function = "solve"
statement = """
Delta and Iceberg store **min/max statistics** for each data file. A query reads only the files whose ranges
could contain matching rows; the rest are skipped. Good clustering (Z-order, liquid clustering) makes these
ranges tight, so more files are skipped.

- `file_stats(file, min_day, max_day, min_amount, max_amount)`
- `predicate(day_from, day_to, amount_at_least)`: one row, for
  `WHERE day BETWEEN day_from AND day_to AND amount >= amount_at_least`.

Build `result` as the `file` names that must be read.
"""
starter = """
from pyspark.sql import functions as F, Window

# file_stats and predicate are DataFrames, and spark is your SparkSession.
# Put your answer in `result`. Prefer a function? def solve(spark, file_stats, predicate): ... return it.
result = file_stats
"""
solution = """
from pyspark.sql import functions as F, Window

result = (file_stats.crossJoin(predicate)
         .filter((F.col("max_day") >= F.col("day_from")) & (F.col("min_day") <= F.col("day_to"))
         & (F.col("max_amount") >= F.col("amount_at_least")))
         .select("file"))
"""


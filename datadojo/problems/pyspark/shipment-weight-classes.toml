title = "Bucket shipments by weight"
lang = "pyspark"
difficulty = "easy"
pattern = "spark-basics"
function = "solve"
statement = """
The warehouse system records `shipments(shipment_id, weight_kg)`. The carrier prices by weight
class, so every shipment needs one.

Write `solve(spark, shipments)` returning `shipment_id, weight_class` where `weight_class` is:

- `"small"` when `weight_kg` is below 1
- `"medium"` when it is at least 1 and below 10
- `"large"` when it is 10 or more
- `"unknown"` when `weight_kg` is NULL

Keep every shipment.
"""
hints = [
  "`F.when(cond, value)` can be chained: `F.when(...).when(...).otherwise(...)`.",
  "Conditions are checked in order, and a comparison with NULL is never true, so handle `F.col(\"weight_kg\").isNull()` first.",
]
starter = """
from pyspark.sql import functions as F

def solve(spark, shipments):
    return shipments
"""
solution = """
from pyspark.sql import functions as F

def solve(spark, shipments):
    w = F.col("weight_kg")
    cls = (F.when(w.isNull(), "unknown")
            .when(w < 1, "small")
            .when(w < 10, "medium")
            .otherwise("large"))
    return shipments.select("shipment_id", cls.alias("weight_class"))
"""

[[tests]]
tables.shipments = { columns = "shipment_id INT, weight_kg DOUBLE", rows = '''[
  [1, 0.4], [2, 1.0], [3, 9.99], [4, 10.0], [5, null], [6, 250.5], [7, 0.0]]''' }

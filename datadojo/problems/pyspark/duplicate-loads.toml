title = "Find records loaded more than once"
lang = "pyspark"
difficulty = "easy"
pattern = "spark-dedup-scd"
function = "solve"
statement = """
A flaky ingestion job sometimes reloads the same file. `loads(order_id, status, amount, loaded_at)`
now contains repeats that differ only in `loaded_at`.

Write `solve(spark, loads)` returning `order_id, status, amount, copies` for every
`(order_id, status, amount)` combination that appears **more than once**, where `copies` is how many
times it appears. Ignore `loaded_at`. For this check two NULLs in the same column count as equal.
"""
hints = [
  "`groupBy` treats NULL keys as one group, which is exactly the rule you need.",
  "`.count()` after `groupBy`, then filter `count > 1`.",
]
starter = """
from pyspark.sql import functions as F

def solve(spark, loads):
    return loads
"""
solution = """
from pyspark.sql import functions as F

def solve(spark, loads):
    return (loads.groupBy("order_id", "status", "amount").agg(F.count("*").alias("copies"))
            .filter(F.col("copies") > 1))
"""

[[tests]]
tables.loads = { columns = "order_id INT, status STRING, amount INT, loaded_at TIMESTAMP", rows = '''[
  [1, "new", 10, "2024-01-01 01:00:00"], [1, "new", 10, "2024-01-01 02:00:00"],
  [1, "paid", 10, "2024-01-01 03:00:00"],
  [2, null, 5, "2024-01-01 01:00:00"], [2, null, 5, "2024-01-01 02:00:00"], [2, null, 5, "2024-01-01 03:00:00"],
  [3, "new", null, "2024-01-01 01:00:00"], [3, "new", null, "2024-01-01 01:00:00"],
  [4, "new", 7, "2024-01-01 01:00:00"]]''' }

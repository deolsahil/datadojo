title = "Product share of category revenue"
lang = "pyspark"
difficulty = "medium"
pattern = "spark-aggregation"
lists = ["pyspark-de"]
function = "solve"
statement = """
`order_lines(category, product, revenue)` has one row per line sold.

Write `solve(spark, order_lines)` returning `category, product, product_revenue, pct_of_category`:

- `product_revenue`: total revenue of the product, rounded to 2 decimals
- `pct_of_category`: `100 * product revenue / category revenue`, rounded to 2 decimals

Compute the percentage from unrounded totals. Every product belongs to exactly one category.
"""
hints = [
  "First `groupBy(\"category\", \"product\")` to get product totals.",
  "Then `F.sum(\"product_revenue\").over(Window.partitionBy(\"category\"))` puts the category total on every row without another join.",
  "Round only in the final `select`.",
]
starter = """
from pyspark.sql import functions as F, Window

def solve(spark, order_lines):
    return order_lines
"""
solution = """
from pyspark.sql import functions as F, Window

def solve(spark, order_lines):
    p = order_lines.groupBy("category", "product").agg(F.sum("revenue").alias("rev"))
    cat = F.sum("rev").over(Window.partitionBy("category"))
    return p.select("category", "product", F.round("rev", 2).alias("product_revenue"),
                    F.round(100 * F.col("rev") / cat, 2).alias("pct_of_category"))
"""

[[tests]]
tables.order_lines = { columns = "category STRING, product STRING, revenue DOUBLE", rows = [
  ["coffee", "espresso", 3.0], ["coffee", "espresso", 3.0], ["coffee", "latte", 4.5],
  ["coffee", "drip", 2.0], ["coffee", "drip", 2.0], ["coffee", "drip", 2.0],
  ["bakery", "croissant", 3.333], ["bakery", "muffin", 3.333], ["bakery", "scone", 3.334],
  ["merch", "mug", 12.0],
] }

title = "Payment method breakdown"
lang = "pyspark"
difficulty = "medium"
pattern = "spark-aggregation"
lists = ["pyspark-de"]
function = "solve"
statement = """
`transactions(merchant_id, method, status, amount)`: `method` is `card`, `wallet` or `bank`;
`status` is `success` or `failed`.

Write `solve(spark, transactions)` returning one row per merchant:
`merchant_id, card_total, wallet_total, failed, failure_rate`

- `card_total` / `wallet_total`: sum of `amount` over **successful** card / wallet transactions,
  rounded to 2 decimals, `0.0` when there are none
- `failed`: number of failed transactions (any method)
- `failure_rate`: `failed` divided by the merchant's total transaction count, rounded to 2 decimals
"""
hints = [
  "Conditional aggregation: `F.sum(F.when(cond, F.col(\"amount\")))` sums only matching rows.",
  "A sum over no matching rows is NULL; wrap it in `F.coalesce(..., F.lit(0.0))`.",
  "`F.count(F.when(status == \"failed\", 1))` counts matching rows, `F.count(\"*\")` counts all.",
]
starter = """
from pyspark.sql import functions as F

def solve(spark, transactions):
    return transactions.groupBy("merchant_id").count()
"""
solution = """
from pyspark.sql import functions as F

def solve(spark, transactions):
    ok = F.col("status") == "success"
    def total(m):
        return F.round(F.coalesce(F.sum(F.when(ok & (F.col("method") == m), F.col("amount"))), F.lit(0.0)), 2)
    failed = F.count(F.when(F.col("status") == "failed", 1))
    return transactions.groupBy("merchant_id").agg(
        total("card").alias("card_total"),
        total("wallet").alias("wallet_total"),
        failed.alias("failed"),
        F.round(failed / F.count("*"), 2).alias("failure_rate"))
"""

[[tests]]
tables.transactions = { columns = "merchant_id INT, method STRING, status STRING, amount DOUBLE", rows = [
  [1, "card", "success", 20.0], [1, "card", "failed", 50.0], [1, "wallet", "success", 5.5],
  [1, "bank", "success", 100.0], [1, "card", "success", 0.75],
  [2, "bank", "failed", 10.0], [2, "bank", "success", 10.0], [2, "wallet", "failed", 3.0],
  [3, "wallet", "success", 1.1], [3, "wallet", "success", 2.2],
] }

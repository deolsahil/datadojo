title = "Liquid clustering: file layout"
lang = "pyspark"
difficulty = "medium"
pattern = "spark-lakehouse"
lists = ["pyspark-de", "lakehouse"]
tags = ["databricks"]
function = "solve"
statement = """
With **liquid clustering** (`CLUSTER BY (region, event_date)`), Databricks keeps rows with similar clustering
keys together in the same files, without fixed partitions. Each file then covers a narrow key range, which
is what makes data skipping work.

- `events(id, region, event_date)`
- `layout(rows_per_file)`: one row.

Simulate the layout: sort rows by `region`, then `event_date`, then `id`, and cut them into files of
`rows_per_file` rows (the last file may be smaller), numbered from 1.

Build `result` as `file, rows, min_region, max_region, min_date, max_date`.
"""
starter = """
from pyspark.sql import functions as F, Window

# events and layout are DataFrames, and spark is your SparkSession.
# Put your answer in `result`. Prefer a function? def solve(spark, events, layout): ... return it.
result = events
"""
solution = """
from pyspark.sql import functions as F, Window

n = layout.first()["rows_per_file"]
w = Window.orderBy("region", "event_date", "id")  # one global order: fine for a simulation, not for big data

result = (events.withColumn("file", F.floor((F.row_number().over(w) - 1) / n).cast("int") + 1)
         .groupBy("file")
         .agg(F.count("*").alias("rows"), F.min("region").alias("min_region"), F.max("region").alias("max_region"),
         F.min("event_date").alias("min_date"), F.max("event_date").alias("max_date")))
"""

[[tests]]
tables.events = { columns = "id INT, region STRING, event_date DATE", rows = [[1, "us", "2024-03-02"], [2, "eu", "2024-03-01"], [3, "us", "2024-03-01"], [4, "apac", "2024-03-05"], [5, "eu", "2024-03-03"], [6, "eu", "2024-03-01"], [7, "us", "2024-03-09"]] }
tables.layout = { columns = "rows_per_file INT", rows = [[3]] }


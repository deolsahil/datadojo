title = "Card velocity check"
lang = "pyspark"
difficulty = "hard"
pattern = "spark-windows"
lists = ["pyspark-de"]
function = "solve"
statement = """
A fraud rule flags a card that is used many times in a short burst.

`txns(txn_id, card_id, ts)`: one row per authorization.

For every transaction, count the transactions on the same card whose `ts` is within the 10 minutes
**ending at** this transaction's `ts`: from `ts - 10 minutes` to `ts`, both inclusive, counting the
transaction itself and any others at the exact same `ts`.

Write `solve(spark, txns)` returning `txn_id, card_id, recent_count` only for transactions with
`recent_count >= 3`.
"""
hints = [
  "Order the window by seconds: `F.col(\"ts\").cast(\"long\")`.",
  "`Window.partitionBy(\"card_id\").orderBy(secs).rangeBetween(-600, 0)` frames by value, not row count, and includes ties.",
  "`F.count(\"*\").over(w)`, then filter.",
]
starter = """
from pyspark.sql import functions as F, Window

def solve(spark, txns):
    return txns.select("txn_id", "card_id", F.lit(3))
"""
solution = """
from pyspark.sql import functions as F, Window

def solve(spark, txns):
    w = Window.partitionBy("card_id").orderBy(F.col("ts").cast("long")).rangeBetween(-600, 0)
    return (txns.select("txn_id", "card_id", F.count("*").over(w).alias("recent_count"))
            .filter("recent_count >= 3"))
"""

[[tests]]
tables.txns = { columns = "txn_id INT, card_id STRING, ts TIMESTAMP", rows = [

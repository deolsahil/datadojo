title = "Weekly signups"
lang = "pyspark"
difficulty = "easy"
pattern = "spark-dates"
function = "solve"
statement = """
`signups(user_id, signed_up_at)` logs every signup attempt; retries mean a user can appear more than once.

Write `solve(spark, signups)` returning `week_start, users`:

- `week_start` is a **DATE**: the Monday of the week (weeks run Monday to Sunday).
- `users` is the number of distinct users who signed up that week.
- Only weeks with at least one signup appear.
"""
hints = [
  "`F.date_trunc(\"week\", ts)` snaps a timestamp to Monday 00:00.",
  "`date_trunc` returns a timestamp; wrap it in `F.to_date` to get a DATE.",
  "Count with `F.countDistinct(\"user_id\")`.",
]
starter = """
from pyspark.sql import functions as F

def solve(spark, signups):
    return signups
"""
solution = """
from pyspark.sql import functions as F

def solve(spark, signups):
    return (signups.groupBy(F.to_date(F.date_trunc("week", "signed_up_at")).alias("week_start"))
            .agg(F.countDistinct("user_id").alias("users")))
"""

[[tests]]
tables.signups = { columns = "user_id INT, signed_up_at TIMESTAMP", rows = [
  [1, "2024-01-01 00:00:00"], [2, "2024-01-07 23:59:59"], [1, "2024-01-03 10:00:00"],
  [3, "2024-01-08 00:00:00"], [4, "2023-12-31 12:00:00"], [3, "2024-01-09 09:00:00"],
] }

title = "Rows failing validation, with reasons"
lang = "pyspark"
difficulty = "medium"
pattern = "spark-quality"
lists = ["pyspark-de"]
function = "solve"
statement = """
Before loading `orders(order_id, customer_id, amount, status, order_date)` into the warehouse, you
quarantine bad rows and say why. The rules:

- `missing_customer`: `customer_id` is NULL.
- `bad_amount`: `amount` is NULL or not positive.
- `bad_status`: `status`, trimmed and lower-cased, is not one of `new`, `paid`, `shipped` (NULL is bad).
- `missing_date`: `order_date` is NULL.

Write `solve(spark, orders)` returning `order_id, reasons` for rows that fail **at least one** rule.
`reasons` is an array of the failed rule names, sorted alphabetically.
"""
hints = [
  "Build one `F.when(condition, F.lit(\"rule_name\"))` per rule. Each is the name or NULL.",
  "Put them in `F.array(...)`, drop the NULLs with `F.filter(arr, lambda x: x.isNotNull())`, then `F.array_sort`.",
  "Careful with NULL logic: `~F.col(\"status\").isin(...)` is NULL (not true) when status is NULL.",
]
starter = """
from pyspark.sql import functions as F

def solve(spark, orders):
    return orders
"""
solution = """
from pyspark.sql import functions as F

def solve(spark, orders):
    status = F.lower(F.trim("status"))
    rules = [
        ("missing_customer", F.col("customer_id").isNull()),
        ("bad_amount", F.col("amount").isNull() | (F.col("amount") <= 0)),
        ("bad_status", F.col("status").isNull() | ~status.isin("new", "paid", "shipped")),
        ("missing_date", F.col("order_date").isNull()),
    ]
    reasons = F.array_sort(F.filter(F.array(*[F.when(c, F.lit(n)) for n, c in rules]),
                                    lambda x: x.isNotNull()))
    return orders.select("order_id", reasons.alias("reasons")).filter(F.size("reasons") > 0)
"""

[[tests]]
tables.orders = { columns = "order_id INT, customer_id INT, amount DOUBLE, status STRING, order_date DATE", rows = '''[
  [1, 10, 5.0, "paid", "2024-06-01"],
  [2, null, 5.0, "Paid ", "2024-06-01"],
  [3, 11, 0.0, "refunded", "2024-06-01"],
  [4, 12, null, null, null],
  [5, null, -1.0, "NEW", null],
  [6, 13, 9.99, "shipped", "2024-05-02"]]''' }

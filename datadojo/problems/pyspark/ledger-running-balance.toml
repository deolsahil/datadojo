title = "Running account balance"
lang = "pyspark"
difficulty = "medium"
pattern = "spark-windows"
lists = ["pyspark-de"]
function = "solve"
statement = """
`ledger(account_id, txn_id, ts, amount)`: deposits are positive, withdrawals negative, and every
account starts at 0. Several transactions can share a timestamp (batch posting); they are applied
in `txn_id` order.

Write `solve(spark, ledger)` returning `account_id, txn_id, balance, overdrawn` where `balance` is the
account balance right after that transaction (rounded to 2 decimals) and `overdrawn` is true when
that balance is below 0.
"""
hints = [
  "`F.sum(\"amount\").over(w)` with `w = Window.partitionBy(\"account_id\").orderBy(\"ts\", \"txn_id\")` is a running total.",
  "With only `orderBy(\"ts\")`, Spark's default frame is a RANGE frame: rows tied on `ts` are summed together.",
  "Being explicit helps: `.rowsBetween(Window.unboundedPreceding, Window.currentRow)`.",
]
starter = """
from pyspark.sql import functions as F, Window

def solve(spark, ledger):
    return ledger.select("account_id", "txn_id", "amount", F.col("amount") < 0)
"""
solution = """
from pyspark.sql import functions as F, Window

def solve(spark, ledger):
    w = (Window.partitionBy("account_id").orderBy("ts", "txn_id")
         .rowsBetween(Window.unboundedPreceding, Window.currentRow))
    bal = F.round(F.sum("amount").over(w), 2)
    return ledger.select("account_id", "txn_id", bal.alias("balance"), (bal < 0).alias("overdrawn"))
"""

[[tests]]

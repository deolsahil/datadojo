title = "Pivot Q1 revenue by month"
lang = "pyspark"
difficulty = "medium"
pattern = "spark-quality"
function = "solve"
statement = """
Finance wants a Q1 2024 crosstab from `sales(region, sale_date, amount)`.

Write `solve(spark, sales)` returning `region, jan, feb, mar`:

- Each month column is that region's total `amount` for that month of **2024**, rounded to 2 decimals,
  or `0.0` when there were no sales that month.
- Sales outside Q1 2024 are ignored, but every region present in `sales` still gets a row (all zeros if needed).
- A NULL `region` is reported as `unknown`.
"""
hints = [
  "`groupBy(\"region\").pivot(\"m\", [1, 2, 3])` with explicit values avoids an extra pass and fixes the column order.",
  "Filter to Q1 *before* pivoting, then left-join the pivot onto the distinct regions so empty regions survive.",
  "Missing cells come back NULL; `F.coalesce(..., F.lit(0.0))` them.",
]
starter = """
from pyspark.sql import functions as F

def solve(spark, sales):
    return sales
"""
solution = """
from pyspark.sql import functions as F

def solve(spark, sales):
    s = sales.withColumn("region", F.coalesce("region", F.lit("unknown")))
    regions = s.select("region").distinct()
    q1 = s.filter((F.col("sale_date") >= "2024-01-01") & (F.col("sale_date") < "2024-04-01"))
    p = (q1.withColumn("m", F.month("sale_date")).groupBy("region")
         .pivot("m", [1, 2, 3]).agg(F.round(F.sum("amount"), 2)))
    out = regions.join(p, "region", "left")
    return out.select("region", *[F.coalesce(F.col(str(m)), F.lit(0.0)).alias(n)
                                  for m, n in [(1, "jan"), (2, "feb"), (3, "mar")]])
"""

[[tests]]
tables.sales = { columns = "region STRING, sale_date DATE, amount DOUBLE", rows = '''[
  ["west", "2024-01-05", 10.0], ["west", "2024-01-20", 5.5], ["west", "2024-03-31", 2.25],
  ["east", "2024-02-29", 7.0], ["east", "2023-12-31", 100.0], ["east", "2024-02-01", 0.1],
  ["east", "2024-02-02", 0.2], ["north", "2024-04-01", 3.0], [null, "2024-01-10", 1.0],
  ["west", "2023-01-15", 50.0]]''' }

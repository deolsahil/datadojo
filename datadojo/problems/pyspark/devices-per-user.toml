title = "Devices per user"
lang = "pyspark"
difficulty = "easy"
pattern = "spark-aggregation"
function = "solve"
statement = """
Security wants to see which devices each account signs in from.
`logins(user_id, device, login_ts)` has one row per login; `device` is NULL when the client did not
report one.

Write `solve(spark, logins)` returning `user_id, device_count, devices` where `devices` is the
ascending-sorted array (plain string order, so uppercase sorts before lowercase) of distinct non-NULL
devices and `device_count` is its length. A user
whose logins all have NULL devices gets `0` and an empty array.
"""
hints = [
  "`F.collect_set(\"device\")` gathers distinct values and skips NULLs.",
  "Sets have no order: wrap it in `F.array_sort(...)`.",
  "`F.size(...)` or `F.countDistinct(\"device\")` gives the count.",
]
starter = """
from pyspark.sql import functions as F

def solve(spark, logins):
    return logins.groupBy("user_id").agg(F.count("device"), F.collect_list("device"))
"""
solution = """
from pyspark.sql import functions as F

def solve(spark, logins):
    return (logins.groupBy("user_id")
            .agg(F.array_sort(F.collect_set("device")).alias("devices"))
            .select("user_id", F.size("devices").alias("device_count"), "devices"))
"""

[[tests]]

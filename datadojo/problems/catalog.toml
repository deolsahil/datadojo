# Patterns and curated lists. Every problem's `pattern` must be one of these ids;
# `lists` entries must be list ids. Order here is display order.

[[lists]]
id = "sql-essentials"
title = "SQL Essentials 50"
desc = "The SQL questions that come up in almost every data interview: joins, aggregation, windows, NULLs."

[[lists]]
id = "sql-e2e"
title = "SQL End-to-End 43"
desc = "Sahil's own collection: 43 real interview-style SQL problems, from seat bookings to Uber rides."

[[lists]]
id = "pyspark-de"
title = "PySpark for Data Engineers"
desc = "DataFrame transformations you will actually write at work: dedup, SCD, windows, nested data."

[[lists]]
id = "python-de"
title = "Python for Data Work"
desc = "Plain-Python data wrangling and the classic coding-round patterns, minus the trivia."


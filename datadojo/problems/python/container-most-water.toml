title = "Container with the most water"
lang = "python"
difficulty = "medium"
pattern = "py-two-pointers"
function = "max_area"
source_url = "https://leetcode.com/problems/container-with-most-water/"
statement = """
`max_area(heights)` gets non-negative wall heights at positions `0..n-1`. Picking two walls
`i < j` holds `min(heights[i], heights[j]) * (j - i)` units of water. Return the largest
amount possible, or `0` if there are fewer than two walls.

- `[1, 8, 6, 2, 5, 4, 8, 3, 7]` → `49` (walls at 1 and 8: `min(8, 7) * 7`)
"""
hints = [
    "Start with the widest container: one pointer at each end.",
    "The shorter wall limits the area. Moving the taller wall inward can never help, so move the shorter one.",
]
starter = "def max_area(heights):\n    pass\n"
solution = """
def max_area(heights):
    i, j, best = 0, len(heights) - 1, 0
    while i < j:
        best = max(best, min(heights[i], heights[j]) * (j - i))
        if heights[i] < heights[j]:
            i += 1
        else:
            j -= 1
    return best
"""


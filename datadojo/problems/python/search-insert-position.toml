title = "Search insert position"
lang = "python"
difficulty = "easy"
pattern = "py-binary-search"
function = "search_insert"
source_url = "https://leetcode.com/problems/search-insert-position/"
statement = """
`search_insert(nums, target)` gets `nums` sorted ascending with distinct values. Return the
index of `target` if present; otherwise the index where it would be inserted to keep the list
sorted. Aim for O(log n).

- `search_insert([1, 3, 5, 6], 2)` → `1`
- `search_insert([1, 3, 5, 6], 7)` → `4`
"""
hints = [
    "Both cases ask the same thing: the first index whose value is `>= target`.",
    "Search the half-open range `[lo, hi)` with `hi = len(nums)` so 'after the end' is a valid answer.",
    "`bisect.bisect_left` is exactly this, but write the loop once yourself.",
]
starter = "def search_insert(nums, target):\n    pass\n"
solution = """
def search_insert(nums, target):
    lo, hi = 0, len(nums)
    while lo < hi:
        mid = (lo + hi) // 2
        if nums[mid] < target:
            lo = mid + 1
        else:
            hi = mid
    return lo
"""


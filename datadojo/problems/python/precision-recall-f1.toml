title = "Precision, recall and F1"
lang = "python"
difficulty = "easy"
pattern = "ml-metrics"
lists = ["ml-ai"]
function = "prf"
statement = """
`prf(y_true, y_pred)` gets two equal-length lists of `0`/`1` labels. Return `[precision, recall, f1]`
for the positive class `1`, each rounded to 4 decimals.

- precision = TP / (TP + FP), recall = TP / (TP + FN), F1 = 2·P·R / (P + R)
- When a denominator is 0, that metric is `0.0` (no division errors).

- `prf([1, 0, 1, 1], [1, 1, 0, 1])` → `[0.6667, 0.6667, 0.6667]`
"""
hints = [
    "Count TP, FP and FN in one pass with zip.",
    "Guard every division: no predicted positives means precision 0.0.",
]
starter = "def prf(y_true, y_pred):\n    pass\n"
solution = """
def prf(y_true, y_pred):
    tp = sum(1 for t, p in zip(y_true, y_pred) if t == 1 and p == 1)
    fp = sum(1 for t, p in zip(y_true, y_pred) if t == 0 and p == 1)
    fn = sum(1 for t, p in zip(y_true, y_pred) if t == 1 and p == 0)
    precision = tp / (tp + fp) if tp + fp else 0.0
    recall = tp / (tp + fn) if tp + fn else 0.0
    f1 = 2 * precision * recall / (precision + recall) if precision + recall else 0.0
    return [round(precision, 4), round(recall, 4), round(f1, 4)]
"""

[[tests]]
args = [[1, 0, 1, 1], [1, 1, 0, 1]]
[[tests]]
args = [[1, 1, 1], [1, 1, 1]]
[[tests]]
args = [[0, 0, 1], [0, 0, 0]]
[[tests]]
args = [[0, 0, 0], [1, 1, 0]]
[[tests]]
args = [[1, 0, 1, 0, 1, 1, 0], [1, 0, 0, 0, 1, 1, 1]]

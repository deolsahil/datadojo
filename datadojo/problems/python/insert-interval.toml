title = "Insert into a sorted interval list"
lang = "python"
difficulty = "medium"
pattern = "py-sorting"
function = "insert"
ordered = true
source_url = "https://leetcode.com/problems/insert-interval/"
statement = """
`insert(intervals, new)` gets a list of closed `[start, end]` intervals that is already sorted
by start and has no overlaps, plus one `new` interval. Insert `new`, merging anything it
overlaps **or touches** (`[1, 5]` and `[5, 7]` become `[1, 7]`), and return the result sorted
by start.

- `insert([[1, 2], [3, 5], [6, 7], [8, 10], [12, 16]], [4, 8])` → `[[1, 2], [3, 10], [12, 16]]`
"""
hints = [
    "Three phases: intervals ending before `new` starts, intervals that overlap it, intervals after.",
    "While merging, grow `new` to `[min(starts), max(ends)]` of everything it touches.",
    "You can do it in one O(n) pass without re-sorting.",
]
starter = "def insert(intervals, new):\n    pass\n"
solution = """
def insert(intervals, new):
    s, e = new
    out, i, n = [], 0, len(intervals)
    while i < n and intervals[i][1] < s:
        out.append(intervals[i]); i += 1
    while i < n and intervals[i][0] <= e:
        s, e = min(s, intervals[i][0]), max(e, intervals[i][1]); i += 1
    out.append([s, e])
    return out + intervals[i:]
"""


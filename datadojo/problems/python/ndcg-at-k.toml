title = "NDCG@k for a search ranking"
lang = "python"
difficulty = "medium"
pattern = "ml-metrics"
lists = ["ml-ai"]
function = "ndcg_at_k"
statement = """
`ndcg_at_k(relevances, k)` gets the graded relevance of each result in the order your system ranked
them (higher is better). Return NDCG@k rounded to 4 decimals.

- DCG@k = Σ over the top k positions i (1-based) of `rel_i / log2(i + 1)`
- IDCG@k is the DCG@k of the best possible order (relevances sorted high to low)
- NDCG@k = DCG@k / IDCG@k, or `0.0` when IDCG@k is 0

- `ndcg_at_k([3, 2, 3, 0, 1, 2], 3)` → `0.9778`
"""
hints = [
    "Write one dcg(list) helper and call it twice.",
    "The ideal ranking is sorted(relevances, reverse=True).",
]
starter = "def ndcg_at_k(relevances, k):\n    pass\n"
solution = """
import math

def ndcg_at_k(relevances, k):
    def dcg(rels):
        return sum(r / math.log2(i + 2) for i, r in enumerate(rels[:k]))
    ideal = dcg(sorted(relevances, reverse=True))
    return round(dcg(relevances) / ideal, 4) if ideal else 0.0
"""


title = "Longest streak of consecutive days"
lang = "python"
difficulty = "medium"
pattern = "py-hashing"
lists = ["python-de"]
function = "longest_streak"
source_url = "https://leetcode.com/problems/longest-consecutive-sequence/"
statement = """
`longest_streak(days)` gets an unsorted list of integer day numbers on which a user was active
(duplicates possible, negatives allowed). Return the length of the longest run of consecutive
integers present, counting each day once. Empty input returns `0`.

- `[100, 4, 200, 1, 3, 2]` → `4` (days 1, 2, 3, 4)
- `[1, 2, 2, 3]` → `3`

Aim for O(n) rather than sorting.
"""
hints = [
    "Put everything in a set so membership checks are O(1) and duplicates vanish.",
    "Only start counting from a day `d` where `d - 1` is not in the set; that day begins a streak.",
    "From each streak start, walk `d + 1, d + 2, ...` while present. Each day is visited a constant number of times.",
]
starter = "def longest_streak(days):\n    pass\n"
solution = """
def longest_streak(days):
    s = set(days)
    best = 0
    for d in s:
        if d - 1 not in s:
            n = 1
            while d + n in s:
                n += 1
            best = max(best, n)
    return best
"""

[[tests]]
args = [[100, 4, 200, 1, 3, 2]]
[[tests]]
args = [[0, 3, 7, 2, 5, 8, 4, 6, 0, 1]]
[[tests]]  # duplicates must not break or extend the streak
args = [[1, 2, 2, 3]]
[[tests]]
args = [[-1, -2, 0, 5]]
[[tests]]

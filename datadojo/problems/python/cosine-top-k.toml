title = "Top-k retrieval by cosine similarity"
lang = "python"
difficulty = "easy"
pattern = "ai-retrieval"
lists = ["ml-ai"]
function = "top_k"
statement = """
`top_k(query, docs, k)` gets an embedding vector for the query and one per document. Return the
indices of the `k` most similar documents by cosine similarity, highest first, breaking ties by the
lower index. A zero vector has similarity `0`.

- `top_k([1, 0], [[1, 0], [0, 1], [1, 1]], 2)` → `[0, 2]`
"""
hints = [
    "cos = dot(a, b) / (|a| \u00b7 |b|), with a guard for zero norms.",
    "sorted(range(n), key=lambda i: (-sim[i], i))[:k]",
]
starter = "def top_k(query, docs, k):\n    pass\n"
solution = """
import math

def top_k(query, docs, k):
    def cos(a, b):
        na, nb = math.sqrt(sum(x * x for x in a)), math.sqrt(sum(x * x for x in b))
        return sum(x * y for x, y in zip(a, b)) / (na * nb) if na and nb else 0.0
    sims = [cos(query, d) for d in docs]
    return sorted(range(len(docs)), key=lambda i: (-sims[i], i))[:k]
"""


title = "Days until a warmer reading"
lang = "python"
difficulty = "medium"
pattern = "py-stack-queue"
lists = ["python-de"]
function = "days_until_warmer"
ordered = true
source_url = "https://leetcode.com/problems/daily-temperatures/"
statement = """
`days_until_warmer(temps)` gets daily temperature readings. Return a list of the same length
where position `i` holds how many days you wait after day `i` until a **strictly** warmer
reading, or `0` if none comes.

- `[73, 74, 75, 71, 69, 72, 76, 73]` → `[1, 1, 4, 2, 1, 1, 0, 0]`
"""
hints = [
    "The nested-loop answer is O(n^2). Which days are still waiting for a warmer one?",
    "Keep a stack of indices whose answer is unknown; their temperatures are non-increasing.",
    "When today is warmer than the top, pop it and fill in `today - index`. Repeat, then push today.",
]
starter = "def days_until_warmer(temps):\n    pass\n"
solution = """
def days_until_warmer(temps):
    out = [0] * len(temps)
    st = []
    for i, t in enumerate(temps):
        while st and temps[st[-1]] < t:
            j = st.pop()
            out[j] = i - j
        st.append(i)
    return out
"""


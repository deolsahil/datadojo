title = "ROC AUC from scratch"
lang = "python"
difficulty = "medium"
pattern = "ml-metrics"
lists = ["ml-ai"]
function = "roc_auc"
statement = """
`roc_auc(y_true, scores)` gets binary labels and a model score per row. Return the ROC AUC rounded
to 4 decimals: the probability that a random positive gets a higher score than a random negative,
counting ties as half. Both classes are always present.

- `roc_auc([0, 0, 1, 1], [0.1, 0.4, 0.35, 0.8])` → `0.75`
"""
hints = [
    "AUC equals the fraction of (positive, negative) pairs ranked correctly.",
    "Score each pair 1 if pos > neg, 0.5 if equal, 0 otherwise, then average.",
]
starter = "def roc_auc(y_true, scores):\n    pass\n"
solution = """
def roc_auc(y_true, scores):
    pos = [s for t, s in zip(y_true, scores) if t == 1]
    neg = [s for t, s in zip(y_true, scores) if t == 0]
    wins = sum(1.0 if p > n else 0.5 if p == n else 0.0 for p in pos for n in neg)
    return round(wins / (len(pos) * len(neg)), 4)
"""

[[tests]]
args = [[0, 0, 1, 1], [0.1, 0.4, 0.35, 0.8]]
[[tests]]

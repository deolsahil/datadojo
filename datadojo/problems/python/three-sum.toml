title = "Three numbers summing to zero"
lang = "python"
difficulty = "medium"
pattern = "py-two-pointers"
function = "three_sum"
source_url = "https://leetcode.com/problems/3sum/"
statement = """
`three_sum(nums)` returns every **distinct** triplet of values `[a, b, c]` taken from three
different positions of `nums` with `a + b + c == 0`. Write each triplet in ascending order
(`a <= b <= c`) and do not repeat a triplet. The list of triplets may be in any order.

- `[-1, 0, 1, 2, -1, -4]` → `[[-1, -1, 2], [-1, 0, 1]]`
"""
hints = [
    "Sort first. Fix the smallest value `a = nums[i]`, then find pairs summing to `-a` in the rest.",
    "The pair search on a sorted suffix is the converging two-pointer pattern.",
    "Skip duplicate values for `i`, and after a hit skip duplicates for both pointers, so no triplet repeats.",
]
starter = "def three_sum(nums):\n    pass\n"
solution = """
def three_sum(nums):
    nums = sorted(nums)
    out = []
    for i in range(len(nums) - 2):
        if i and nums[i] == nums[i - 1]:
            continue
        lo, hi = i + 1, len(nums) - 1
        while lo < hi:
            s = nums[i] + nums[lo] + nums[hi]
            if s < 0:
                lo += 1
            elif s > 0:
                hi -= 1
            else:
                out.append([nums[i], nums[lo], nums[hi]])
                lo += 1
                while lo < hi and nums[lo] == nums[lo - 1]:
                    lo += 1
                hi -= 1
    return out
"""


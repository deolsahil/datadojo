title = "Common free time across schedules"
lang = "python"
difficulty = "hard"
pattern = "py-sorting"
function = "free_time"
ordered = true
source_url = "https://leetcode.com/problems/employee-free-time/"
statement = """
`free_time(schedules)` gets one list per person (or per pipeline worker) of busy
`[start, end]` intervals. A person's list may be empty or unsorted.

Return every gap where **nobody** is busy, between the earliest busy start and the latest busy
end, as `[start, end]` pairs sorted by start. Only gaps of positive length count: intervals
that touch (`[1, 2]` and `[2, 3]`) leave no gap. No busy intervals at all → `[]`.

- `[[[1, 2], [5, 6]], [[1, 3]], [[4, 10]]]` → `[[3, 4]]`
"""
hints = [
    "Who is busy does not matter, only when. Flatten all intervals into one list.",
    "Sort by start and sweep, tracking the furthest end seen so far.",
    "A gap appears exactly when the next start is strictly greater than the furthest end.",
]
starter = "def free_time(schedules):\n    pass\n"
solution = """
def free_time(schedules):
    busy = sorted(iv for person in schedules for iv in person)
    out = []
    if not busy:
        return out
    end = busy[0][1]
    for s, e in busy[1:]:
        if s > end:
            out.append([end, s])
        end = max(end, e)
    return out
"""

[[tests]]
args = [[[[1, 2], [5, 6]], [[1, 3]], [[4, 10]]]]
[[tests]]
args = [[[[1, 3], [6, 7]], [[2, 4]], [[2, 5], [9, 12]]]]
[[tests]]  # touching leaves no gap; one interval swallows another
args = [[[[1, 2], [3, 4]], [[2, 3]], [[0, 10]]]]
[[tests]]  # unsorted, an empty schedule, nested interval must not reset the end
args = [[[[8, 9], [1, 6]], [], [[2, 3], [10, 11]]]]
[[tests]]

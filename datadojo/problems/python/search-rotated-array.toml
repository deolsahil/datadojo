title = "Search a rotated sorted list"
lang = "python"
difficulty = "medium"
pattern = "py-binary-search"
lists = ["python-de"]
function = "search"
source_url = "https://leetcode.com/problems/search-in-rotated-sorted-array/"
statement = """
`search(nums, target)` gets distinct integers that were sorted ascending and then rotated at an
unknown pivot, e.g. `[0, 1, 2, 4, 5, 6, 7]` might become `[4, 5, 6, 7, 0, 1, 2]`. (It may also
not be rotated at all.) Return the index of `target`, or `-1` if absent, in O(log n).

- `search([4, 5, 6, 7, 0, 1, 2], 0)` → `4`
"""
hints = [
    "Split at `mid`: at least one of the halves `[lo, mid]` or `[mid, hi]` is sorted.",
    "Compare `nums[lo]` with `nums[mid]` to tell which half is sorted.",
    "If `target` lies within the sorted half's range, search there; otherwise search the other half.",
]
starter = "def search(nums, target):\n    pass\n"
solution = """
def search(nums, target):
    lo, hi = 0, len(nums) - 1
    while lo <= hi:
        mid = (lo + hi) // 2
        if nums[mid] == target:
            return mid
        if nums[lo] <= nums[mid]:
            if nums[lo] <= target < nums[mid]:
                hi = mid - 1
            else:
                lo = mid + 1
        else:
            if nums[mid] < target <= nums[hi]:
                lo = mid + 1
            else:
                hi = mid - 1
    return -1
"""


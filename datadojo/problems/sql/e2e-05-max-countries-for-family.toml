title = "Maximum Countries a Person Can Live In"
lang = "sql"
difficulty = "easy"
pattern = "sql-joins"
lists = ["sql-e2e"]
source_url = "https://github.com/deolsahil/sql-end-to-end-questions"
statement = """
Table `FAMILIES(ID, NAME, FAMILY_SIZE)` lists families (`ID` is unique; names may repeat). Table
`COUNTRIES(ID, NAME, MIN_SIZE, MAX_SIZE)` lists countries that accept families whose size is between `MIN_SIZE`
and `MAX_SIZE`, inclusive.

Return a single column `maximum_countries`: the largest number of countries any one family can live in.
"""
starter = "SELECT COUNT(*) AS maximum_countries\nFROM COUNTRIES\n"
solution = """
SELECT MAX(cnt) AS maximum_countries
FROM (
  SELECT f.ID, COUNT(*) AS cnt
  FROM FAMILIES f
  JOIN COUNTRIES c ON f.FAMILY_SIZE BETWEEN c.MIN_SIZE AND c.MAX_SIZE
  GROUP BY f.ID
) t
"""
hints = [
  "Join on a range condition: FAMILY_SIZE BETWEEN MIN_SIZE AND MAX_SIZE.",
  "Count countries per family, then take the MAX of those counts.",
  "Group by the family ID, not the name: two different families can share a name.",
]


title = "Running revenue per store"
lang = "sql"
difficulty = "easy"
pattern = "sql-window-running"
lists = ["sql-essentials"]
ordered = true
statement = """
Table `sales(store, day, amount)` (one row per store per day).

Return `store, day, running_total`, where `running_total` is the cumulative revenue of that
store up to and including `day`. Order by `store, day`.
"""
starter = "SELECT store, day, amount\nFROM sales\n"
solution = """
SELECT store, day, SUM(amount) OVER (PARTITION BY store ORDER BY day) AS running_total
FROM sales ORDER BY store, day
"""

[[tests]]
tables.sales = { columns = "store STRING, day DATE, amount INT", rows = [
  ["s1", "2024-01-01", 10], ["s1", "2024-01-02", 20], ["s1", "2024-01-03", 5],
  ["s2", "2024-01-01", 7], ["s2", "2024-01-03", 3],
] }

[[tests]]  # rows not inserted in date order
tables.sales = { columns = "store STRING, day DATE, amount INT", rows = [
  ["b", "2024-03-02", 1], ["a", "2024-03-02", 2], ["b", "2024-03-01", 4], ["a", "2024-03-01", 8],
] }

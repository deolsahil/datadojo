title = "7-day moving average of revenue"
lang = "sql"
difficulty = "medium"
pattern = "sql-window-running"
lists = ["sql-essentials"]
ordered = true
statement = """
Table `daily_revenue(day, revenue)`, at most one row per day. Days with no sales are **missing** from the table
and count as revenue 0.

For each day in the table, compute the trailing 7-day average: the total revenue over that day and the
6 calendar days before it, divided by 7. Only report days that have a full 7-day window, i.e. days at least
6 days after the earliest day in the table.

Return `day, avg_7d` with `avg_7d` rounded to 2 decimals, ordered by `day`.
"""
starter = "SELECT day, ROUND(AVG(revenue) OVER (ORDER BY day ROWS BETWEEN 6 PRECEDING AND CURRENT ROW), 2) AS avg_7d\nFROM daily_revenue\nORDER BY day\n"
solution = """
SELECT a.day, ROUND(SUM(b.revenue) / 7.0, 2) AS avg_7d
FROM daily_revenue a
JOIN daily_revenue b ON b.day BETWEEN a.day - 6 AND a.day
WHERE a.day >= (SELECT MIN(day) FROM daily_revenue) + 6
GROUP BY a.day
ORDER BY a.day
"""
hints = [
  "A ROWS frame counts rows, not days. With missing days, 6 PRECEDING rows can reach back more than 6 days.",
  "Either use a RANGE frame over dates, or self-join each day to the rows whose day is between day - 6 and day.",
  "Divide the window's SUM by 7 (not AVG, which divides by the rows present), and filter day >= MIN(day) + 6.",
]

[[tests]]  # no gaps
tables.daily_revenue = { columns = "day DATE, revenue DOUBLE", rows = [
  ["2024-03-01", 10.0], ["2024-03-02", 20.0], ["2024-03-03", 30.0], ["2024-03-04", 40.0],
  ["2024-03-05", 50.0], ["2024-03-06", 60.0], ["2024-03-07", 70.0], ["2024-03-08", 80.0],
] }

[[tests]]  # missing days count as 0, month boundary
tables.daily_revenue = { columns = "day DATE, revenue DOUBLE", rows = [
  ["2024-01-28", 7.0], ["2024-01-30", 14.0], ["2024-02-02", 21.0], ["2024-02-03", 1.0],
  ["2024-02-04", 3.5], ["2024-02-10", 100.0], ["2024-02-11", 2.0],
] }

[[tests]]  # fewer than 7 days of history: nothing to report
tables.daily_revenue = { columns = "day DATE, revenue DOUBLE", rows = [
  ["2024-06-01", 5.0], ["2024-06-06", 5.0],
] }

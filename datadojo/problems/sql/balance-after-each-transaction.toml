title = "Running account balance"
lang = "sql"
difficulty = "easy"
pattern = "sql-window-running"
statement = """
Table `transactions(txn_id, account_id, txn_date, amount)`. Deposits are positive, withdrawals negative.

Return `txn_id, account_id, balance`, where `balance` is the account's balance **right after** that
transaction: the sum of all of that account's amounts up to and including it.

Transactions are applied in `txn_date` order; several transactions on the same day are applied in
`txn_id` order, so each one gets its own balance. Any row order.
"""
starter = "SELECT txn_id, account_id, amount AS balance\nFROM transactions\n"
solution = """
SELECT txn_id, account_id,
       SUM(amount) OVER (PARTITION BY account_id ORDER BY txn_date, txn_id
                         ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS balance
FROM transactions
"""
hints = [
  "A running sum is SUM(...) OVER (PARTITION BY ... ORDER BY ...).",
  "If you only ORDER BY txn_date, same-day transactions are peers and all get the end-of-day total. Add a tiebreaker.",
  "ORDER BY txn_date, txn_id (and optionally ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW).",
]

[[tests]]
tables.transactions = { columns = "txn_id INT, account_id INT, txn_date DATE, amount INT", rows = [
  [1, 100, "2024-01-01", 500], [2, 100, "2024-01-03", -200], [3, 200, "2024-01-02", 50], [4, 100, "2024-01-05", 75],
] }

[[tests]]  # same-day transactions must each get their own balance
tables.transactions = { columns = "txn_id INT, account_id INT, txn_date DATE, amount INT", rows = [
  [10, 1, "2024-02-01", 100], [11, 1, "2024-02-01", -30], [12, 1, "2024-02-01", -20],
  [9, 1, "2024-02-02", 5], [13, 2, "2024-01-31", -10],
] }

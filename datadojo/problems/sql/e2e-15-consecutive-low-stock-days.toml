title = "Consecutive Days with Low Stock"
lang = "sql"
difficulty = "hard"
pattern = "sql-gaps-islands"
lists = ["sql-e2e"]
source_url = "https://github.com/deolsahil/sql-end-to-end-questions"
statement = """
Table `stock(supplier_id, product_id, stock_quantity, record_date)` has at most one row per supplier, product and
day; some days are missing.

Find every streak of **2 or more consecutive calendar days** on which a (supplier, product) had a recorded
`stock_quantity` below 50. A missing day breaks the streak. Return `supplier_id, product_id,
total_consecutive_count, first_date` (streak length and its first day), one row per streak. Any row order.
"""
starter = "SELECT supplier_id, product_id, COUNT(*) AS total_consecutive_count, MIN(record_date) AS first_date\nFROM stock\nWHERE stock_quantity < 50\nGROUP BY supplier_id, product_id\n"
solution = """
WITH low AS (
  SELECT supplier_id, product_id, record_date,
         record_date - CAST(ROW_NUMBER() OVER (PARTITION BY supplier_id, product_id ORDER BY record_date) AS INT) AS grp
  FROM stock
  WHERE stock_quantity < 50
)
SELECT supplier_id, product_id, COUNT(*) AS total_consecutive_count, MIN(record_date) AS first_date
FROM low
GROUP BY supplier_id, product_id, grp
HAVING COUNT(*) >= 2
"""
hints = [
  "Filter to low-stock rows first; consecutive low days then have consecutive dates.",
  "record_date minus ROW_NUMBER() (per supplier and product, ordered by date) is constant within a streak.",
  "Group by supplier, product and that key, keep groups with COUNT(*) >= 2.",
]

[[tests]]
tables.stock = { columns = "supplier_id INT, product_id INT, stock_quantity INT, record_date DATE", rows = [
  [1, 1, 60, "2022-01-01"], [1, 1, 40, "2022-01-02"], [1, 1, 35, "2022-01-03"], [1, 1, 45, "2022-01-04"],

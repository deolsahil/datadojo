  [2, 1, 45, "2022-01-06"], [2, 1, 55, "2022-01-07"], [2, 2, 45, "2022-01-08"], [2, 2, 48, "2022-01-09"],
  [2, 2, 35, "2022-01-10"], [2, 2, 52, "2022-01-15"], [2, 2, 23, "2022-01-16"],

title = "Employees who manage nobody"
lang = "sql"
difficulty = "medium"
pattern = "sql-nulls"
lists = ["sql-essentials"]
statement = """
HR wants to list individual contributors: people who are nobody's manager.

Table `employees(id, name, manager_id)`. `manager_id` is NULL for the CEO (and for anyone whose manager is not recorded yet).

Return `id` and `name` of every employee whose `id` does not appear as any employee's `manager_id`.
"""
starter = "SELECT id, name\nFROM employees\nWHERE id NOT IN (SELECT manager_id FROM employees)\n"
solution = """
SELECT e.id, e.name FROM employees e
WHERE NOT EXISTS (SELECT 1 FROM employees r WHERE r.manager_id = e.id)
"""
hints = [
  "Run the starter query. Why does it return nothing at all?",
  "`x NOT IN (1, 2, NULL)` is `x <> 1 AND x <> 2 AND x <> NULL`, and `x <> NULL` is UNKNOWN, so the whole thing is never TRUE.",
  "Use NOT EXISTS with a correlated subquery, or add `WHERE manager_id IS NOT NULL` inside the NOT IN subquery.",
]

[[tests]]
tables.employees = { columns = "id INT, name STRING, manager_id INT", rows = '[[1, "Ceo", null], [2, "Vp", 1], [3, "Dev", 2], [4, "Ops", 2]]' }

[[tests]]  # several NULL manager_ids
tables.employees = { columns = "id INT, name STRING, manager_id INT", rows = '[[1, "Ann", null], [2, "Bo", null], [3, "Cy", 1], [4, "Di", null]]' }

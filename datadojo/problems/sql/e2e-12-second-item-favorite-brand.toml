title = "Seller's Second Item Brand Preference"
lang = "sql"
difficulty = "hard"
pattern = "sql-window-ranking"
lists = ["sql-e2e"]
source_url = "https://github.com/deolsahil/sql-end-to-end-questions"
statement = """
A marketplace has `Users(user_id, join_date, favorite_brand)`, `orders(order_id, order_date, item_id, buyer_id,
seller_id)` and `items(item_id, item_brand)`. Every user can sell; a seller never sells two items on the same date.

For **every user** return `seller_id` (the user's id) and `is_favorite_brand`: `'Yes'` if the second item they
sold (by `order_date`) has their favourite brand, otherwise `'No'`. Users who sold fewer than two items get `'No'`.
Any row order.
"""
starter = "SELECT user_id AS seller_id, 'No' AS is_favorite_brand\nFROM Users\n"
solution = """
WITH s AS (
  SELECT seller_id, item_id,
         ROW_NUMBER() OVER (PARTITION BY seller_id ORDER BY order_date) AS rn
  FROM orders
)
SELECT u.user_id AS seller_id,
       CASE WHEN i.item_brand = u.favorite_brand THEN 'Yes' ELSE 'No' END AS is_favorite_brand
FROM Users u
LEFT JOIN s ON s.seller_id = u.user_id AND s.rn = 2
LEFT JOIN items i ON i.item_id = s.item_id
"""
hints = [
  "Number each seller's sales by order_date with ROW_NUMBER().",
  "Start from Users and LEFT JOIN only the rn = 2 sale, so sellers with fewer sales stay in the output.",
  "Putting rn = 2 in WHERE instead of the ON clause drops those users. Then join items and compare brands.",
]

[[tests]]
tables.Users = { columns = "user_id INT, join_date DATE, favorite_brand STRING", rows = [
  [1, "2019-01-01", "Lenovo"], [2, "2019-02-09", "Samsung"], [3, "2019-01-19", "LG"], [4, "2019-05-21", "HP"],
] }
tables.orders = { columns = "order_id INT, order_date DATE, item_id INT, buyer_id INT, seller_id INT", rows = [
  [1, "2019-08-01", 4, 1, 2], [2, "2019-08-02", 2, 1, 3], [3, "2019-08-03", 3, 2, 3],
  [4, "2019-08-04", 1, 4, 2], [5, "2019-08-04", 1, 3, 4], [6, "2019-08-05", 2, 2, 4],
] }
tables.items = { columns = "item_id INT, item_brand STRING", rows = [
  [1, "Samsung"], [2, "Lenovo"], [3, "LG"], [4, "HP"],
] }


title = "Genres Without Movies"
lang = "sql"
difficulty = "easy"
pattern = "sql-joins"
lists = ["sql-e2e", "sql-essentials"]
source_url = "https://github.com/deolsahil/sql-end-to-end-questions"
statement = """
Tables `Movies(MovieID, Title, ReleaseDate, GenreID)` and `Genres(GenreID, GenreName)`. A movie's `GenreID` may be
NULL when it has not been classified yet.

Return `GenreID, GenreName` for every genre that has no movie. Any row order.
"""
starter = "SELECT GenreID, GenreName\nFROM Genres\n"
solution = """
SELECT g.GenreID, g.GenreName
FROM Genres g
WHERE NOT EXISTS (SELECT 1 FROM Movies m WHERE m.GenreID = g.GenreID)
"""
hints = [
  "This is an anti join: genres with no matching movie.",
  "NOT IN (SELECT GenreID FROM Movies) returns nothing at all once Movies contains a NULL GenreID.",
  "Use NOT EXISTS, or a LEFT JOIN and keep rows where the movie side IS NULL.",
]

[[tests]]
tables.Movies = { columns = "MovieID INT, Title STRING, ReleaseDate DATE, GenreID INT", rows = [
  [1, "Inception", "2010-07-16", 1], [2, "The Dark Knight", "2008-07-18", 1], [3, "Interstellar", "2014-11-07", 1],
  [4, "Pulp Fiction", "1994-10-14", 2], [5, "The Shawshank Redemption", "1994-09-23", 3],
] }
tables.Genres = { columns = "GenreID INT, GenreName STRING", rows = [
  [1, "Sci-Fi"], [2, "Crime"], [3, "Drama"], [4, "Comedy"], [5, "Horror"],
] }

[[tests]]  # an unclassified movie (NULL GenreID) breaks NOT IN
tables.Movies = { columns = "MovieID INT, Title STRING, ReleaseDate DATE, GenreID INT", rows = '''[
  [1, "Inception", "2010-07-16", 1], [2, "Untitled Project", "2025-01-01", null]
]''' }
tables.Genres = { columns = "GenreID INT, GenreName STRING", rows = [
  [1, "Sci-Fi"], [4, "Comedy"], [5, "Horror"],
] }

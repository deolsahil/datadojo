title = "Cancellation rate per driver"
lang = "sql"
difficulty = "medium"
pattern = "sql-aggregation"
statement = """
Ops flags drivers who cancel too often.

Table `trips(id, driver_id, status)`, `status` one of `completed`, `cancelled_by_driver`, `cancelled_by_rider`.

Return `driver_id` and `cancel_rate`: the fraction of that driver's trips with status `cancelled_by_driver`, rounded to 2 decimals (`ROUND(x, 2)`). Rider cancellations count in the denominator but not the numerator. Drivers who never cancelled show `0.0`.
"""
starter = "SELECT driver_id, COUNT(*) AS cancel_rate\nFROM trips\nGROUP BY driver_id\n"
solution = """
SELECT driver_id,
       ROUND(SUM(CASE WHEN status = 'cancelled_by_driver' THEN 1 ELSE 0 END) * 1.0 / COUNT(*), 2) AS cancel_rate
FROM trips
GROUP BY driver_id
"""
hints = [
  "A rate is (matching rows) / (all rows), both computed per driver.",
  "SUM(CASE WHEN status = 'cancelled_by_driver' THEN 1 ELSE 0 END) gives the numerator; COUNT(*) the denominator.",
  "Multiply by 1.0 before dividing so engines with integer division (Spark is fine, but Postgres/SQL Server are not) don't truncate to 0.",
]

[[tests]]
tables.trips = { columns = "id INT, driver_id INT, status STRING", rows = [[1, 10, "completed"], [2, 10, "cancelled_by_driver"], [3, 10, "completed"], [4, 11, "cancelled_by_rider"], [5, 11, "completed"], [6, 12, "cancelled_by_driver"]] }

[[tests]]  # rounding: 1/3 and 2/3
tables.trips = { columns = "id INT, driver_id INT, status STRING", rows = [[1, 1, "cancelled_by_driver"], [2, 1, "completed"], [3, 1, "completed"], [4, 2, "cancelled_by_driver"], [5, 2, "cancelled_by_driver"], [6, 2, "cancelled_by_rider"]] }

  [2, "2023-05-01", 1], [2, "2023-05-02", 1], [2, "2023-05-03", 1], [2, "2023-05-04", 0], [2, "2023-05-05", 0],
  [3, "2023-05-01", 0], [3, "2023-05-02", 0], [3, "2023-05-03", 1], [3, "2023-05-04", 0], [3, "2023-05-05", 0],
  [4, "2023-05-01", 0], [4, "2023-05-02", 0], [4, "2023-05-03", 0], [4, "2023-05-04", 0], [4, "2023-05-05", 1],
] }


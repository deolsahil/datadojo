title = "Customers who bought the whole catalog"
lang = "sql"
difficulty = "hard"
pattern = "sql-aggregation"
source_url = "https://leetcode.com/problems/customers-who-bought-all-products/"
statement = """
A "completionist" badge goes to customers who have bought **every** product currently in the catalog.

Tables `catalog(product_id)` (one row per current product) and `purchases(customer_id, product_id)`. A customer may buy the same product many times, and `purchases` also contains discontinued products that are **no longer** in `catalog`.

Return the `customer_id` of each customer who has purchased every product in `catalog` at least once. If `catalog` is empty, return nobody.
"""
starter = "SELECT DISTINCT customer_id\nFROM purchases\n"
solution = """
SELECT p.customer_id
FROM purchases p
JOIN catalog c ON c.product_id = p.product_id
GROUP BY p.customer_id
HAVING COUNT(DISTINCT p.product_id) = (SELECT COUNT(*) FROM catalog)
"""
hints = [
  "Bought everything means: number of distinct catalog products the customer bought = number of products in the catalog.",
  "Repeat purchases inflate COUNT(*), and discontinued products inflate COUNT(DISTINCT product_id) unless you restrict to catalog products first.",
  "Join purchases to catalog, GROUP BY customer, HAVING COUNT(DISTINCT product_id) = (SELECT COUNT(*) FROM catalog).",
]

[[tests]]
tables.catalog = { columns = "product_id INT", rows = [[1], [2], [3]] }
tables.purchases = { columns = "customer_id INT, product_id INT", rows = [[100, 1], [100, 2], [100, 3], [200, 1], [200, 2], [300, 3], [300, 3]] }

[[tests]]  # repeats and a discontinued product must not make up the count
tables.catalog = { columns = "product_id INT", rows = [[1], [2]] }
tables.purchases = { columns = "customer_id INT, product_id INT", rows = [[10, 1], [10, 1], [20, 1], [20, 9], [30, 2], [30, 1], [30, 9]] }

[[tests]]  # empty catalog
tables.catalog = { columns = "product_id INT", rows = [] }
tables.purchases = { columns = "customer_id INT, product_id INT", rows = [[1, 5]] }

title = "Group Winners with Tiebreaker"
lang = "sql"
difficulty = "hard"
pattern = "sql-window-ranking"
lists = ["sql-e2e"]
source_url = "https://github.com/deolsahil/sql-end-to-end-questions"
statement = """
A tournament has `players(player_id, group_id)` and `matches(match_id, first_player, second_player, first_score,
second_score)`. Both players of a match are in the same group.

A player's total score is the sum of the points they scored across all their matches (as first or second
player); a player with no matches has 0. The winner of each group is the player with the highest total; if
players tie, the lowest `player_id` wins.

Return `group_id, player_id, total_score` for the winner of every group in `players`. Any row order.
"""
starter = "SELECT group_id, MIN(player_id) AS player_id, 0 AS total_score\nFROM players\nGROUP BY group_id\n"
solution = """
WITH s AS (
  SELECT first_player AS player_id, first_score AS score FROM matches
  UNION ALL
  SELECT second_player, second_score FROM matches
),
t AS (
  SELECT p.group_id, p.player_id, COALESCE(SUM(s.score), 0) AS total_score
  FROM players p
  LEFT JOIN s ON s.player_id = p.player_id
  GROUP BY p.group_id, p.player_id
)
SELECT group_id, player_id, total_score
FROM (
  SELECT *, ROW_NUMBER() OVER (PARTITION BY group_id ORDER BY total_score DESC, player_id) AS rn FROM t
) x
WHERE rn = 1
"""
hints = [
  "Unpivot matches: one row per (player, score) using UNION ALL of the first and second sides.",
  "Sum per player, starting from players with a LEFT JOIN so players with no matches score 0.",
  "ROW_NUMBER() OVER (PARTITION BY group_id ORDER BY total_score DESC, player_id) = 1.",
]

[[tests]]
tables.players = { columns = "player_id INT, group_id INT", rows = [
  [15, 1], [25, 1], [30, 1], [45, 1], [10, 2], [35, 2], [50, 2], [20, 3], [40, 3],
] }
tables.matches = { columns = "match_id INT, first_player INT, second_player INT, first_score INT, second_score INT", rows = [
  [1, 15, 45, 3, 0], [2, 30, 25, 1, 2], [3, 30, 15, 2, 0], [4, 40, 20, 5, 2], [5, 35, 50, 1, 1],
] }

[[tests]]  # scores split across first/second sides; a group where nobody played; a tie
tables.players = { columns = "player_id INT, group_id INT", rows = [
  [7, 1], [3, 1], [9, 1], [4, 2], [2, 2], [8, 3], [6, 3],
] }
tables.matches = { columns = "match_id INT, first_player INT, second_player INT, first_score INT, second_score INT", rows = [
  [1, 3, 7, 2, 3], [2, 9, 3, 1, 2], [3, 7, 9, 0, 0], [4, 8, 6, 4, 4],
] }

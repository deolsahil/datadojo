title = "Highest Average Rated Movie by Genre"
lang = "sql"
difficulty = "medium"
pattern = "sql-window-ranking"
lists = ["sql-e2e"]
source_url = "https://github.com/deolsahil/sql-end-to-end-questions"
statement = """
A movie site stores `movies(id, genre, title)` and `reviews(movie_id, rating)` (`rating` is `DECIMAL(3,1)`).

For each genre find the movie with the highest average rating. If two movies in a genre tie on average rating,
pick the one whose `title` comes first alphabetically. Movies with no reviews are ignored.

Return `genre, title, average_rating, rating`, where `average_rating` is the average rounded to the nearest whole
number (halves round up) and `rating` is that many `*` characters (e.g. 4 becomes `****`). Any row order.
"""
starter = "SELECT m.genre, m.title, 0 AS average_rating, '' AS rating\nFROM movies m\n"
solution = """
WITH a AS (
  SELECT m.genre, m.title, AVG(r.rating) AS avg_rating,
         ROW_NUMBER() OVER (PARTITION BY m.genre ORDER BY AVG(r.rating) DESC, m.title) AS rn
  FROM movies m
  JOIN reviews r ON r.movie_id = m.id
  GROUP BY m.id, m.genre, m.title
)
SELECT genre, title,
       CAST(ROUND(avg_rating, 0) AS INT) AS average_rating,
       repeat('*', CAST(ROUND(avg_rating, 0) AS INT)) AS rating
FROM a
WHERE rn = 1
"""
hints = [
  "First compute AVG(rating) per movie, then pick the best one per genre.",
  "ROW_NUMBER() OVER (PARTITION BY genre ORDER BY AVG(rating) DESC, title) handles the tie-break.",
  "repeat('*', n) builds the star string; round the average and cast it to an integer first.",
]


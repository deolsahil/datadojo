  ["Orrisa", "Rourkela", 100], ["Orrisa", "Bhubaneshwar", 400], ["Orrisa", "Cuttack", 300],
  ["Haryana", "Gurgaon", 500], ["Haryana", "Bhiwani", 300], ["Haryana", "Faridabad", 400],

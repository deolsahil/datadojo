title = "Total headcount under each manager"
lang = "sql"
difficulty = "medium"
pattern = "sql-recursive"
statement = """
Table `employees(id, name, manager_id)`; `manager_id` is NULL at the top. No cycles.

For every employee who manages at least one person, return `id, name, headcount`: the number of people who
report to them **directly or indirectly** (reports of reports, all the way down). Employees with no reports
do not appear. Any row order.
"""
starter = "SELECT m.id, m.name, COUNT(*) AS headcount\nFROM employees m\nJOIN employees e ON e.manager_id = m.id\nGROUP BY m.id, m.name\n"
solution = """
WITH RECURSIVE under AS (
  SELECT manager_id AS boss, id AS report FROM employees WHERE manager_id IS NOT NULL
  UNION ALL
  SELECT u.boss, e.id FROM under u JOIN employees e ON e.manager_id = u.report
)
SELECT m.id, m.name, COUNT(*) AS headcount
FROM under u JOIN employees m ON m.id = u.boss
GROUP BY m.id, m.name
"""
hints = [
  "Build every (boss, report) pair, at any distance, then count per boss.",
  "Anchor: direct pairs (manager_id, id). Recursive step: if boss manages r, boss also manages everyone whose manager_id = r.",
  "Join employees e ON e.manager_id = u.report, keep u.boss, and finally GROUP BY the boss.",
]
source_url = "https://leetcode.com/problems/all-people-report-to-the-given-manager/"

[[tests]]
tables.employees = { columns = "id INT, name STRING, manager_id INT", rows = '''[
  [1, "Ceo", null], [2, "Vp", 1], [3, "Lead", 2], [4, "Dev", 3], [5, "Dev2", 3], [6, "Cfo", 1]
]''' }


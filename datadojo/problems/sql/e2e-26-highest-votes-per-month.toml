title = "Highest Votes Per Month"
lang = "sql"
difficulty = "medium"
pattern = "sql-window-ranking"
lists = ["sql-e2e"]
source_url = "https://github.com/deolsahil/sql-end-to-end-questions"
statement = """
Table `Elections(CandidateID, VoterID, VoteDate)`, one row per vote.

For every month (year and month, formatted `'YYYY-MM'`), find the candidate with the most votes that month. If several
candidates tie, pick the one with the **lowest** `CandidateID`.

Return `Year_date, CandidateID, VoteCount`, one row per month. Any row order.
"""
starter = "SELECT *\nFROM Elections\n"
solution = """
WITH monthly AS (
  SELECT strftime(VoteDate, '%Y-%m') AS Year_date, CandidateID, COUNT(*) AS VoteCount
  FROM Elections
  GROUP BY Year_date, CandidateID
)
SELECT Year_date, CandidateID, VoteCount
FROM monthly
QUALIFY ROW_NUMBER() OVER (PARTITION BY Year_date ORDER BY VoteCount DESC, CandidateID) = 1
"""
hints = [
  "First count votes per (month, candidate). strftime(VoteDate, '%Y-%m') gives the month key.",
  "Rank candidates within each month by VoteCount DESC, then CandidateID ASC as the tiebreaker.",
  "Keep rank 1 with ROW_NUMBER (or QUALIFY in DuckDB).",
]

